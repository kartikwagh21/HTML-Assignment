<html>
<head>
  <title>Box Model Practice</title>

  <style>
    .box1 {
      background-color: lightblue;
      padding: 10px;
      border: 2px solid black;
      margin: 5px;
    }
    .box2 {
      background-color: lightgreen;
      padding: 20px;
      border: 4px dashed red;
      margin: 15px;
    }

    .box3 {
      background-color: lightyellow;
      padding: 30px;
      border: 6px dotted blue;
      margin: 25px;
    }
  </style>
</head>
<body>
  <p>Padding: 10px, Border: 2px solid, Margin: 5px</p>
  <div class="box1">
    This is BOX 1 content.
  </div>
  <p>Padding: 20px, Border: 4px dashed, Margin: 15px</p>
  <div class="box2">
    This is BOX 2 content.
  </div>
  <p>Padding: 30px, Border: 6px dotted, Margin: 25px</p>
  <div class="box3">
    This is BOX 3 content.
  </div>
</body>
</html>
